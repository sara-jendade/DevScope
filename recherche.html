<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevScope - Recherche</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="api.js" defer></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#030303] via-[#001A08] to-[#00FF41] text-white flex flex-col">

    <header class="sticky top-0 z-50 w-full rounded-4xl border-b border-white/30 bg-white/[0.03] backdrop-blur-xl">

        <nav class="flex h-20 items-center justify-between px-4 sm:px-8">

            <a href="index.html" class="flex items-center gap-3">

                <div class="size-5 shrink-0 rounded-full bg-radial-[at_50%_75%] from-[#B7FFCB] via-[#00FF41] to-[#004D16] to-90% shadow-[0_0_12px_rgba(0,255,65,0.6)]"></div>

                <span class="font-['Redaction'] text-xl font-bold text-white">
                    DevScope
                </span>

            </a>

            <div class="flex items-center gap-4 sm:gap-8">

                <a href="recherche.html"
                    class="font-['Redaction'] text-base font-bold text-[#00FF41]">
                    Recherche
                </a>

                <a href="shortlist.html"
                    class="font-['Redaction'] text-base font-bold text-white transition-colors hover:text-[#00FF41]">
                    Short List
                </a>

            </div>

        </nav>

    </header>

    <main class="flex flex-1 flex-col items-center justify-center gap-6 p-4">

        <section class="w-full max-w-2xl text-center">

            <span class="rounded-full border border-[#00FF41]/30 bg-[#00FF41]/10 px-4 py-2 text-sm text-[#00FF41]">
                GitHub Developer Search
            </span>

            <h1 class="mt-6 font-['Redaction'] text-4xl font-bold sm:text-6xl">
                Find a <span class="text-[#00FF41]">Developer</span>
            </h1>

            <p class="mt-5 leading-7 text-white/60">
                Search GitHub by username to discover developers,
                explore their profiles, and check their repositories.
            </p>

        </section>

        <form id="search" class="flex w-full max-w-2xl gap-3">

            <input
                id="username"
                type="text"
                placeholder="Search by GitHub username..."
                autocomplete="off"
                class="flex-1 min-w-0 rounded-full border border-white/20 bg-white/10 px-5 py-5 text-white outline-none placeholder:text-white/40 focus:border-[#00FF41]"
            >

            <button
                type="submit"
                class="rounded-full bg-gradient-to-br from-[#030303] via-[#001A08] to-[#00FF41] px-8 py-4 font-bold text-white transition hover:opacity-80"
            >
                Search
            </button>

        </form>

        <div id="result" class="w-full max-w-2xl text-center text-red-400"></div>

    </main>

    <footer class="border-t border-white/10 px-6 py-6 text-center text-sm text-white/40">
        DevScope — Discover developers through their code.
    </footer>

</body>
</html>
