<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevScope - Recherche</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="card.js" defer></script>
    <script src="search.js" defer></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#030303] via-[#001A08] to-[#00FF41] text-white flex flex-col">

    <header class="sticky top-0 z-50 w-full rounded-4xl border-b border-white/30 bg-white/[0.03] backdrop-blur-xl">

        <nav class="flex h-20 items-center justify-between px-4 sm:px-8">

            <a href="index.html" class="flex items-center gap-3">

                <div class="size-5 shrink-0 rounded-full bg-radial-[at_50%_75%] from-[#B7FFCB] via-[#00FF41] to-[#004D16] to-90% shadow-[0_0_12px_rgba(0,255,65,0.6)]"></div>

                <span class="font-['Redaction'] text-xl font-bold text-white">
                    DevScope
                </span>

            </a>

            <div class="flex items-center gap-4 sm:gap-8">

                <a
                    href="recherche.html"
                    class="font-['Redaction'] text-base font-bold text-white transition-colors hover:text-[#00FF41]"
                >
                    Recherche
                </a>

                <a
                    href="shortlist.html"
                    class="font-['Redaction'] text-base font-bold text-white transition-colors hover:text-[#00FF41]"
                >
                    Short List
                </a>

        </nav>

    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4">


        <div id="result" class="w-full max-w-2xl">

            <div class="rounded-3xl border border-white/20 bg-black/40 p-6 shadow-xl">

                <div class="flex items-center gap-4">

                    <img
                        id="profile"
                        src=""
                        alt="GitHub avatar"
                        class="size-20 rounded-full border-2 border-[#00FF41]"
                    >

                    <div>
                        <h2 id="name" class="text-2xl font-bold">
                        </h2>

                        <p id="username" class="text-[#00FF41]">
                        </p>
                    </div>

                </div>

                <p id="bio" class="my-1 text-white/70"></p>
                <p id="company" class="text-l font-bold"  ></p>
                <p id="location"></p>
                <p id="created_at"></p>
                <br>

                <div class="grid grid-cols-3 gap-5 text-center">

                    <div>
                        <p id="repos" class="text-2xl font-bold"></p>
                        <p class="text-sm text-white/50">Repos</p>
                    </div>

                    <div>
                        <p id="followers" class="text-2xl font-bold"></p>
                        <p class="text-sm text-white/50">Followers</p>
                    </div>

                    <div>
                        <p id="following" class="text-2xl font-bold"></p>
                        <p class="text-sm text-white/50">Following</p>
                    </div>



                </div>

                <a
                    id="link"
                    href="#"
                    target="_blank"
                    class="mt-6 block rounded-full bg-[#00FF41] p-3 text-center font-bold text-black"
                >
                    View GitHub Profile
                </a>

            </div>

        </div>


    </main>

</body>
</html>
