<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find good developers">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Redaction:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="api.js" defer></script>

    <title>DevScope</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#030303] via-[#001A08] to-[#00FF41] text-white flex flex-col">

    <header class="sticky top-0 z-50 w-full rounded-4xl border-b border-white/30 bg-white/[0.03] shadow-[0_1px_15px_rgba(255,255,255,0.08)] backdrop-blur-xl">

        <nav class="flex h-20 w-full items-center justify-between border-x border-white/10 px-4 sm:px-8">

            <a href="index.html" class="flex items-center gap-3">

                <div class="size-5 shrink-0 rounded-full bg-radial-[at_50%_75%] from-[#B7FFCB] via-[#00FF41] to-[#004D16] to-90% shadow-[0_0_12px_rgba(0,255,65,0.6)]"></div>

                <span class="font-['Redaction'] text-xl font-bold text-white">
                    DevScope
                </span>

            </a>

            <div class="flex items-center gap-4 sm:gap-8">

                <a
                    href="recherche.html"
                    class="font-['Redaction'] text-base font-bold text-white transition-colors hover:text-[#00FF41]"
                >
                    Recherche
                </a>

                <a
                    href="shortlist.html"
                    class="font-['Redaction'] text-base font-bold text-white transition-colors hover:text-[#00FF41]"
                >
                    Short List
                </a>

            </div>

        </nav>

    </header>

    <main class="flex-1 flex flex-col items-center justify-center gap-6 p-4">

        <form id="search" class="flex w-full max-w-2xl gap-3">

            <input
                id="username"
                type="text"
                placeholder="Search by github username :"
                class="flex-1 min-w-0 rounded-full border border-white/20 bg-white/10 px-5 py-5 text-white outline-none"
            >

            <button
                type="submit"
                class="rounded-full bg-gradient-to-br from-[#030303] via-[#001A08] to-[#00FF41] px-8 py-4 font-bold text-white transition hover:opacity-80"
            >
                Search
            </button>

        </form>

        <div id="result" class="w-full max-w-2xl"></div> 

    </main>

</body>
</html>
